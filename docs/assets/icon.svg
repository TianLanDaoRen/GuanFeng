<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    观风 GuanFeng 应用图标 · 宣纸剪纸
    ────────────────────────────────
    两个元素，一个意象：**云在风里**。

    · 云 —— 平底剪纸云，四瓣不对称，底边是利落的一刀
    · 风 —— 三条向左扫出的带尖笔触（厚右、尖左、中段微微上扬），
            这是汉字「风」与敦煌风纹的写法，也是"观风"两个字的形

    只有两色：**宣纸的象牙 + 墨**。好处是缩到 48px 仍然成立——
    剪影本身必须好看，颜色是加分项而不是拐杖（玻璃质感那版就败在这一点）。

    视觉重心压在几何中心：图上缘 108、下缘 404。
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#EDE4D4"/>
    </linearGradient>
    <clipPath id="badge">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <circle cx="256" cy="256" r="256" fill="url(#ground)"/>

    <g fill="#161C24">
      <!-- 平底云 -->
      <rect x="146" y="194" width="230" height="62" rx="31"/>
      <circle cx="196" cy="206" r="46"/>
      <circle cx="264" cy="172" r="64"/>
      <circle cx="330" cy="188" r="54"/>
      <circle cx="374" cy="218" r="38"/>

      <!--
        风纹三条：右端厚、左端收成尖的笔触。

        右端用一段**半圆弧收笔**（A 命令），不是直接闭合——
        直接 Z 会把右端切成一条竖直线，看起来像被裁掉的色块而不是一笔风。
      -->
      <path d="M 392 256 Q 250 224 86 270 Q 250 256 392 284 A 14 14 0 0 1 392 256 Z"/>
      <path d="M 362 318 Q 226 286 70 334 Q 226 320 362 344 A 13 13 0 0 1 362 318 Z"/>
      <path d="M 306 382 Q 214 356 118 390 Q 214 380 306 404 A 11 11 0 0 1 306 382 Z"/>
    </g>
  </g>
</svg>
