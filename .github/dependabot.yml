# 每周检查一次 Gradle 依赖与 GitHub Actions 的安全更新。
# 这个项目不追新，但**安全公告要跟**：Compose 与 AGP 的安全修复是随版本走的。
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
