# 每周检查一次 Gradle 依赖与 GitHub Actions 的安全更新。
# 这个项目不追新，但**安全公告要跟**：Compose 与 AGP 的安全修复是随版本走的。
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 跨大版本的 Kotlin 编译器升级一律不提（见已关闭的 PR #3 的讨论）：
      # 本项目不需要新语言特性，而编译器对可空性的推断会随大版本改变，
      # 那种变化构建不报错、只在运行时显形 —— 而这个应用要连续无人值守跑几周。
      # 真要升的时候手动改 libs.versions.toml，并把这条 ignore 一起删掉。
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
